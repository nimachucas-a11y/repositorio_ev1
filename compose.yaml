services:
  microservicio:
    image: "microservicio-usuarios:${IMAGE_TAG:-local}"
    build:
      context: .
    ports:
      - target: 8080
        host_ip: 127.0.0.1
    restart: unless-stopped
    cpus: 0.50
    mem_limit: 128m
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
